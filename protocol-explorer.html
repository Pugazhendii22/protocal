          u: 'https://spiffe.io/', level: 'advanced' },
        { t: 'Cloud provider VPC docs (AWS as the reference)', a: 'AWS', tag: 'free · docs',
          why: 'Route tables, security groups versus NACLs, and flow logs. Vendor-specific names, universal concepts — the model transfers to GCP and Azure intact.',
          u: 'https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html', level: 'beginner → advanced' },
        { t: 'BPF Performance Tools', a: 'Brendan Gregg', tag: 'book · eBPF',
          why: 'The follow-up to the observability lessons: how to answer "which process is dropping these packets?" on a real Linux host.',
          u: 'https://www.brendangregg.com/bpf-performance-tools-book.html', level: 'advanced' },
      ],
    },
    {
      group: 'Security, packets and performance',
      items: [
        { t: 'Practical Packet Analysis', a: 'Chris Sanders', tag: 'Wireshark',
          why: 'The book to read with a capture open beside this site. Teaches the workflow: what to look at, in what order, and when to stop.',
          u: 'https://nostarch.com/packetanalysis3', level: 'beginner → intermediate' },
        { t: 'Attacking Network Protocols', a: 'James Forshaw', tag: 'offensive',
          why: 'How to reason about a protocol as an attacker: framing, state machines, authentication gaps. Sharpens your reading of every lesson here.',
          u: 'https://nostarch.com/autopsi', level: 'advanced' },
        { t: 'Bulletproof SSL and TLS', a: 'Ivan Ristić', tag: 'TLS',
          why: 'The definitive practical TLS reference — certificate chains, revocation, and every misconfiguration you will ever meet.',
          u: 'https://www.feistyduck.com/books/bulletproof-ssl-and-tls/', level: 'intermediate → advanced' },
      ],
    },
  ];

  const REPOS = [
    { t: 'SystemsApproach/book', d: 'Source of Computer Networks: A Systems Approach (CC BY 4.0). Build it locally as HTML, EPUB or PDF.', u: 'https://github.com/SystemsApproach/book', tag: 'textbook source' },
    { t: 'SystemsApproach/7E', d: 'The working draft of the 7th edition — the most current open networking text available.', u: 'https://github.com/SystemsApproach/7E', tag: 'textbook source' },
    { t: 'SystemsApproach/tcpcc', d: 'TCP Congestion Control micro-book. The reference for the sawtooth, CUBIC and BBR.', u: 'https://github.com/SystemsApproach/tcpcc', tag: 'congestion control' },
    { t: 'SystemsApproach/security', d: 'Network Security micro-book: firewalls, middleboxes, DDoS defence, zero trust.', u: 'https://github.com/SystemsApproach/security', tag: 'security' },
    { t: 'SystemsApproach/sdn', d: 'Software-Defined Networks micro-book — control planes, overlays, programmable data planes.', u: 'https://github.com/SystemsApproach/sdn', tag: 'SDN' },
    { t: 'facyber/awesome-networking', d: 'Curated list of courses, books and tutorials, from CCNA through to packet analysis.', u: 'https://github.com/facyber/awesome-networking', tag: 'list' },
    { t: 'chrissanders/packets', d: 'A large collection of real capture files from teaching and incident work. Free to use.', u: 'https://github.com/chrissanders/packets', tag: 'pcaps' },
    { t: 'Wireshark sample captures (mirror)', d: 'The community mirror of the official Wireshark SampleCaptures wiki, browsable by protocol.', u: 'https://github.com/briliant-ben/PacketCaptures', tag: 'pcaps' },
    { t: 'PaloAltoNetworks/Unit42-Wireshark-tutorials', d: 'Capture sets built for teaching filters, host identification and object extraction.', u: 'https://github.com/PaloAltoNetworks/Unit42-Wireshark-tutorials', tag: 'pcaps + tutorials' },
    { t: 'amwalding/IPv6_Extension_Header_PCAPs', d: 'The rare stuff: real captures with hop-by-hop, routing, fragment and ESP extension headers.', u: 'https://github.com/amwalding/IPv6_Extension_Header_PCAPs', tag: 'IPv6 pcaps' },
    { t: 'qmonnet/awesome-ebpf', d: 'Curated eBPF projects, papers and tutorials — the map for the observability lesson.', u: 'https://github.com/qmonnet/awesome-ebpf', tag: 'eBPF' },
    { t: 'cilium/pwru', d: '"Packet, where are you?" — trace one packet through every kernel function and find the drop.', u: 'https://github.com/cilium/pwru', tag: 'eBPF tool' },
    { t: 'cilium/cilium', d: 'eBPF-based networking, security and observability — a real production data plane to read.', u: 'https://github.com/cilium/cilium', tag: 'eBPF tool' },
    { t: 'kubernetes/kubernetes', d: 'The kube-proxy and CoreDNS wiring lives in the tree. Search for iptables DNAT rules and the service CIDR constants.', u: 'https://github.com/kubernetes/kubernetes', tag: 'cloud' },
    { t: 'istio/istio', d: 'The reference service mesh: sidecar injection, SPIFFE identities, AuthorizationPolicy — the mesh lesson with real code.', u: 'https://github.com/istio/istio', tag: 'service mesh' },
    { t: 'spiffe/spire', d: 'A production implementation of workload identity: attestation, SVIDs, rotation.', u: 'https://github.com/spiffe/spire', tag: 'identity' },
    { t: 'the-tcpdump-group/tcpdump', d: 'Read the source for a printer (e.g. print-tcp.c) and every field of every header stops being abstract.', u: 'https://github.com/the-tcpdump-group/tcpdump', tag: 'tooling source' },
    { t: 'google/gopacket', d: 'A packet parsing library with clean, readable decoders — the fastest way to see how a real parser is structured.', u: 'https://github.com/google/gopacket', tag: 'tooling source' },
  ];

  const RFCS = [
    ['RFC 791', 'IPv4', 'https://datatracker.ietf.org/doc/html/rfc791'],
    ['RFC 793 / 9293', 'TCP', 'https://datatracker.ietf.org/doc/html/rfc9293'],
    ['RFC 768', 'UDP', 'https://datatracker.ietf.org/doc/html/rfc768'],
    ['RFC 8200', 'IPv6', 'https://datatracker.ietf.org/doc/html/rfc8200'],
    ['RFC 4861', 'Neighbor Discovery', 'https://datatracker.ietf.org/doc/html/rfc4861'],
    ['RFC 4862', 'SLAAC', 'https://datatracker.ietf.org/doc/html/rfc4862'],
    ['RFC 9110 / 9112', 'HTTP semantics and HTTP/1.1', 'https://datatracker.ietf.org/doc/html/rfc9110'],
    ['RFC 9113 / 9114', 'HTTP/2 and HTTP/3', 'https://datatracker.ietf.org/doc/html/rfc9113'],
    ['RFC 8446', 'TLS 1.3', 'https://datatracker.ietf.org/doc/html/rfc8446'],
    ['RFC 9000', 'QUIC', 'https://datatracker.ietf.org/doc/html/rfc9000'],
    ['RFC 7323', 'TCP window scaling and timestamps', 'https://datatracker.ietf.org/doc/html/rfc7323'],
    ['RFC 8305', 'Happy Eyeballs v2', 'https://datatracker.ietf.org/doc/html/rfc8305'],
    ['RFC 4271', 'BGP-4', 'https://datatracker.ietf.org/doc/html/rfc4271'],
    ['RFC 6888', 'Carrier-grade NAT requirements', 'https://datatracker.ietf.org/doc/html/rfc6888'],
    ['RFC 1035', 'DNS', 'https://datatracker.ietf.org/doc/html/rfc1035'],
    ['RFC 2131', 'DHCP', 'https://datatracker.ietf.org/doc/html/rfc2131'],
    ['RFC 2474', 'DSCP / differentiated services', 'https://datatracker.ietf.org/doc/html/rfc2474'],
    ['RFC 3550', 'RTP / RTCP', 'https://datatracker.ietf.org/doc/html/rfc3550'],
    ['RFC 8445', 'ICE (NAT traversal)', 'https://datatracker.ietf.org/doc/html/rfc8445'],
    ['RFC 7348', 'VXLAN', 'https://datatracker.ietf.org/doc/html/rfc7348'],
    ['RFC 4033-4035', 'DNSSEC', 'https://datatracker.ietf.org/doc/html/rfc4033'],
    ['RFC 8484', 'DNS over HTTPS', 'https://datatracker.ietf.org/doc/html/rfc8484'],
    ['RFC 5905', 'NTPv4', 'https://datatracker.ietf.org/doc/html/rfc5905'],
  ];

  function card(item) {
    return '<div class="gl" style="display:flex;flex-direction:column;gap:5px">' +
      '<div style="display:flex;gap:7px;align-items:baseline;flex-wrap:wrap"><b>' + esc(item.t) + '</b>' +
      (item.a ? '<span style="font-size:11.5px;color:var(--muted)">' + esc(item.a) + '</span>' : '') + '</div>' +
      (item.tag ? '<div><span class="chip" style="font-size:9.5px;padding:1px 7px">' + esc(item.tag) + '</span>' +
        (item.level ? '<span class="chip mono" style="font-size:9.5px;padding:1px 7px;margin-left:4px">' + esc(item.level) + '</span>' : '') + '</div>' : '') +
      '<p style="margin:0">' + esc(item.why || item.d) + '</p>' +
      '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:2px">' +
      '<a href="' + item.u + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-size:11.5px;font-weight:600">' + esc(shortUrl(item.u)) + ' ↗</a>' +
      (item.gh ? '<a href="' + item.gh + '" target="_blank" rel="noopener noreferrer" style="color:var(--muted);font-size:11.5px">source ↗</a>' : '') +
      '</div></div>';
  }

  function shortUrl(u) {
    return String(u).replace(/^https?:\/\//, '').replace(/\/$/, '');
  }

  function lessonRefRows() {
    const all = U.LESSONS.filter((l) => l.refs && l.refs.length);
    if (!all.length) return '';
    return '<div class="panel" style="margin-top:16px"><div class="hd"><span>Where each lesson points</span>' +
      '<span class="spacer"></span><span class="mono" style="text-transform:none;letter-spacing:0">' + all.length + ' lessons with sources</span></div>' +
      '<div class="bd" style="padding:0"><table class="grid"><thead><tr><th>Lesson</th><th>Read next</th></tr></thead><tbody>' +
      all.map((l) => '<tr><td class="hi" style="font-family:var(--sans);font-size:12px">' +
        '<button style="color:var(--accent);font-family:var(--sans);font-size:12px;text-align:left" data-act="openLesson" data-id="' + l.id + '">' + esc(l.title) + '</button></td>' +
        '<td style="font-family:var(--sans);font-size:11.5px;color:var(--text2)">' +
        l.refs.map((r) => '<a href="' + r.u + '" target="_blank" rel="noopener noreferrer" style="color:var(--text2);border-bottom:1px dotted #33475f">' + esc(r.t) + '</a>').join(' · ') +
        '</td></tr>').join('') +
      '</tbody></table></div></div>';
  }

  function render() {
    const q = S.search.trim().toLowerCase();
    const match = (o) => !q || JSON.stringify(o).toLowerCase().includes(q);

    let h = '<div class="sectionhead"><div><h2>Sources & further reading</h2>' +
      '<p>The books, repositories and RFCs this course is written against — with a note on what each one is actually for. Links open in a new tab.</p></div>' +
      '<div class="searchbox">' + U.ICON.search + '<input id="srcsearch" placeholder="Filter sources…" value="' + esc(S.search) + '" /></div></div>';

    h += '<div class="panel" style="margin-bottom:16px"><div class="hd"><span>How to use this page</span></div>' +
      '<div class="bd" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px">' +
      [['Finished the course?', 'Read Kurose & Ross or the free Systems Approach book end to end. This site is the on-ramp; those are the road.'],
        ['Want packet fluency?', 'Practical Packet Analysis, then download real captures from the repositories below and try to explain every packet before reading the answer.'],
        ['Working on performance?', 'High Performance Browser Networking, then the TCP Congestion Control micro-book. Those two cover almost every real incident.'],
        ['Working on infrastructure?', 'The SDN and Network Security micro-books, then read a real data plane such as cilium.']]
        .map(([t, d]) => '<div><div style="font-size:12.5px;font-weight:650;margin-bottom:3px">' + esc(t) + '</div>' +
          '<div style="font-size:12px;color:var(--muted);line-height:1.55">' + esc(d) + '</div></div>').join('') +
      '</div></div>';

    BOOKS.forEach((g) => {
      const items = g.items.filter(match);
      if (!items.length) return;
      h += '<div class="sectionhead" style="margin:18px 0 10px"><div><h2 style="font-size:16.5px">' + esc(g.group) + '</h2></div></div>' +
        '<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">' + items.map(card).join('') + '</div>';
    });

    const repos = REPOS.filter(match);
    if (repos.length) {
      h += '<div class="sectionhead" style="margin:22px 0 10px"><div><h2 style="font-size:16.5px">Repositories worth cloning</h2>' +
        '<p>Textbooks you can build, capture libraries to practise on, and tools that see inside the kernel.</p></div></div>' +
        '<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">' + repos.map(card).join('') + '</div>';
    }

    if (!q) h += lessonRefRows();

    const rfcs = RFCS.filter((r) => !q || JSON.stringify(r).toLowerCase().includes(q));
    if (rfcs.length) {
      h += '<div class="panel" style="margin-top:20px"><div class="hd"><span>The specifications themselves</span>' +
        '<span class="spacer"></span><span class="mono" style="text-transform:none;letter-spacing:0">' + rfcs.length + ' RFCs</span></div>' +
        '<div class="bd" style="padding:0"><table class="grid"><thead><tr><th>RFC</th><th>Protocol</th><th>Link</th></tr></thead><tbody>' +
        rfcs.map(([id, name, u]) => '<tr><td class="hi">' + esc(id) + '</td><td style="font-family:var(--sans);font-size:12px">' + esc(name) + '</td>' +
          '<td><a href="' + u + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-size:11px">datatracker ↗</a></td></tr>').join('') +
        '</tbody></table></div></div>';
    }

    if (!q && !repos.length) h += '<div class="empty">Nothing matches that filter.</div>';
    return h;
  }

  root.PE_SOURCES = { render };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
   extras.js — exam mode, protocol timeline, command palette (Ctrl+K)
   ============================================================ */
(function (root) {
  'use strict';
  const U = root.PE_UI;
  const { S, esc, LESSONS, TRACKS, byId, ICON } = U;
  const D = root.PE_DATA;

  /* ---------------- exam mode ---------------- */
  const EXAM_SIZES = [8, 12, 20];
  S.exam = S.exam || { stage: 'setup', scope: 'all', n: 12, qs: [], i: 0, ans: [], left: 0, secs: 0 };

  function pool(scope) {
    const out = [];
    LESSONS.forEach((l) => {
      if (scope !== 'all' && l.track !== scope) return;
      (l.quiz || []).forEach((q, qi) => out.push({ lessonId: l.id, qi: qi, q: q, track: l.track, title: l.title }));
    });
    return out;
  }

  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  const timers = {};
  function clearTimer() { if (timers.h) { clearInterval(timers.h); timers.h = null; } }

  function examStart() {
    const p = shuffle(pool(S.exam.scope)).slice(0, S.exam.n);
    Object.assign(S.exam, { stage: 'run', qs: p, i: 0, ans: [], left: p.length * 45, secs: p.length * 45 });
    clearTimer();
    timers.h = setInterval(() => {
      if (S.exam.stage !== 'run') { clearTimer(); return; }
      S.exam.left -= 1;
      const el = document.getElementById('examclock');
      if (S.exam.left <= 0) { clearTimer(); examFinish(); root.PE_APP.render(); return; }
      if (el) {
        el.textContent = clockStr(S.exam.left);
        el.className = 'mono' + (S.exam.left <= 30 ? ' danger' : S.exam.left <= 90 ? ' warn' : '');
      }
    }, 1000);
    root.PE_APP.render();
  }

  const clockStr = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  function examAnswer(o) {
    if (S.exam.stage !== 'run') return;
    S.exam.ans[S.exam.i] = o;
    if (S.exam.i < S.exam.qs.length - 1) S.exam.i += 1;
    root.PE_APP.render();
  }
  function examSkip() {
    if (S.exam.stage !== 'run') return;
    if (S.exam.i < S.exam.qs.length - 1) S.exam.i += 1;
    root.PE_APP.render();
  }
  function examBack() {
    if (S.exam.stage !== 'run' || S.exam.i === 0) return;
    S.exam.i -= 1;
    root.PE_APP.render();
  }
  function examFinish() {
    clearTimer();
    S.exam.stage = 'done';
    let right = 0;
    S.exam.qs.forEach((it, k) => { if (S.exam.ans[k] === it.q.a) right += 1; });
    S.exam.score = { right, total: S.exam.qs.length, pct: Math.round((right / S.exam.qs.length) * 100) };
    S.exam.spent = S.exam.secs - Math.max(0, S.exam.left);
    root.PE_APP.render();
  }
  function examReset() {
    clearTimer();
    S.exam = { stage: 'setup', scope: S.exam.scope || 'all', n: S.exam.n || 12, qs: [], i: 0, ans: [], left: 0, secs: 0 };
    root.PE_APP.render();
  }

  function renderExam() {
    const E = S.exam;
    if (E.stage === 'setup') {
      const p = pool(E.scope);
      let h = '<div class="page narrow">' +
        '<div class="eyebrow">Exam mode</div>' +
        '<h1>Test yourself under a clock</h1>' +
        '<p class="lead">Every quiz question in the course, sampled at random. No feedback until the end, and a time limit — ' +
        'because recalling under pressure is a different skill from reading comfortably.</p>';

      h += '<div class="panel"><div class="panel-h"><b>1 · Scope</b></div><div class="panel-b">' +
        '<div class="chips">' +
        '<button class="chip' + (E.scope === 'all' ? ' on' : '') + '" data-act="exam-scope" data-v="all">Whole course · ' + pool('all').length + ' questions</button>';
      TRACKS.forEach((t) => {
        const n = pool(t.id).length;
        if (!n) return;
        h += '<button class="chip' + (E.scope === t.id ? ' on' : '') + '" data-act="exam-scope" data-v="' + t.id + '">' +
          esc(t.title) + ' · ' + n + '</button>';
      });
      h += '</div></div></div>';

      h += '<div class="panel"><div class="panel-h"><b>2 · Length</b></div><div class="panel-b"><div class="chips">';
      EXAM_SIZES.forEach((n) => {
        const avail = p.length;
        const capped = Math.min(n, avail);
        h += '<button class="chip' + (E.n === n ? ' on' : '') + '" data-act="exam-size" data-v="' + n + '">' +
          capped + ' questions · ' + clockStr(capped * 45) + '</button>';
      });
      h += '</div><p class="fine">45 seconds per question. Unanswered questions count as wrong, so guess rather than stall.</p></div></div>';

      h += '<div class="panel"><div class="panel-b row"><div class="muted">' + (p.length ? (E.scope === 'all' ? 'Mixed across all ' + TRACKS.length + ' tracks.' : 'From one track only.') : 'No questions in this scope.') + '</div>' +
        '<div class="spacer"></div><button class="btn primary lg" data-act="exam-start"' + (p.length ? '' : ' disabled') + '>Start exam</button></div></div>';
      h += '</div>';
      return h;
    }

    if (E.stage === 'run') {
      const it = E.qs[E.i];
      const t = U.trackOf[it.track];
      const picked = E.ans[E.i];
      let h = '<div class="page narrow exam">' +
        '<div class="exambar"><div class="mono muted">Question ' + (E.i + 1) + ' / ' + E.qs.length + '</div>' +
        '<div class="exprog">' + E.qs.map((x, k) => '<i class="' + (E.ans[k] !== undefined ? 'on' : k === E.i ? 'cur' : '') + '"></i>').join('') + '</div>' +
        '<div class="spacer"></div><div id="examclock" class="mono">' + clockStr(E.left) + '</div></div>' +
        '<div class="eyebrow" style="color:' + t.color + '">Track ' + t.n + ' · ' + esc(t.title) + '</div>' +
        '<h2 class="qstem">' + esc(it.q.q) + '</h2><div class="opts">';
      it.q.opts.forEach((o, k) => {
        h += '<button class="opt' + (picked === k ? ' on' : '') + '" data-act="exam-answer" data-o="' + k + '">' +
          '<span class="key">' + 'ABCD'[k] + '</span><span>' + esc(o) + '</span></button>';
      });
      h += '</div><div class="row" style="margin-top:18px">' +
        '<button class="btn ghost" data-act="exam-back"' + (E.i === 0 ? ' disabled' : '') + '>‹ Back</button>' +
        '<button class="btn ghost" data-act="exam-skip">Skip</button><div class="spacer"></div>' +
        (E.i === E.qs.length - 1 ? '<button class="btn primary" data-act="exam-finish">Finish</button>' : '<span class="fine">Answer to continue</span>') +
        '</div></div>';
      return h;
    }

    /* results */
    const sc = E.score;
    const byTrack = {};
    E.qs.forEach((it, k) => {
      const rec = byTrack[it.track] || (byTrack[it.track] = { right: 0, total: 0 });
      rec.total += 1;
      if (E.ans[k] === it.q.a) rec.right += 1;
    });
    let h = '<div class="page narrow"><div class="eyebrow">Exam results</div>' +
      '<h1>' + sc.right + ' / ' + sc.total + ' <span class="muted" style="font-size:20px">· ' + sc.pct + '%</span></h1>' +
      '<p class="lead">' + (sc.pct >= 90 ? 'Strong. Move on to the messy edges: failures, asymmetry, MTU.' :
        sc.pct >= 70 ? 'Solid foundation. The misses below point at exactly which lessons to reread.' :
          'Worth another pass through the earlier tracks — the gaps here are the ones that bite in production.') +
      ' Time used ' + clockStr(E.spent) + '.</p>';

    h += '<div class="panel"><div class="panel-h"><b>By track</b></div><div class="panel-b"><div class="tkrows">';
    Object.keys(byTrack).forEach((tid) => {
      const t = U.trackOf[tid], r = byTrack[tid];
      h += '<div class="tkrow"><span class="dot" style="color:' + t.color + '"></span><span class="nm">' + esc(t.title) + '</span>' +
        '<span class="bar"><i style="width:' + Math.round((r.right / r.total) * 100) + '%;background:' + t.color + '"></i></span>' +
        '<span class="mono">' + r.right + '/' + r.total + '</span></div>';
    });
    h += '</div></div></div>';

    h += '<div class="panel"><div class="panel-h"><b>Every question</b><span class="mono muted">' +
      (sc.total - sc.right) + ' to review</span></div><div class="panel-b"><div class="revlist">';
    E.qs.forEach((it, k) => {
      const ok = E.ans[k] === it.q.a;
      h += '<div class="rev' + (ok ? ' ok' : ' bad') + '">' +
        '<div class="revq"><span class="mark">' + (ok ? '✓' : '✕') + '</span><span>' + esc(it.q.q) + '</span></div>' +
        '<div class="reva">Your answer: <b>' + (E.ans[k] === undefined ? 'none' : esc(it.q.opts[E.ans[k]])) + '</b>' +
        (ok ? '' : '<br>Correct: <b>' + esc(it.q.opts[it.q.a]) + '</b>') + '</div>' +
        (ok ? '' : '<div class="revy">' + esc(it.q.why) + '</div>') +
        '<button class="lnk" data-act="lesson" data-id="' + it.lessonId + '">↗ ' + esc(it.title) + '</button></div>';
    });
    h += '</div></div></div>';
    h += '<div class="row" style="margin-top:16px"><button class="btn primary" data-act="exam-again">New exam</button>' +
      '<button class="btn ghost" data-act="view" data-v="tour">Back to course</button></div></div>';
    return h;
  }

  /* ---------------- protocol timeline ---------------- */
  function renderTimeline() {
    const T = D.TIMELINE || [];
    let h = '<div class="page"><div class="eyebrow">History</div><h1>The internet, one decision at a time</h1>' +
      '<p class="lead">Every protocol in this course exists because something broke, or because someone refused the obvious workaround. ' +
      'Read top to bottom and the shape of the modern internet stops looking accidental.</p><div class="tl">';
    T.forEach((row) => {
      const p = row[3] ? D.PROTOCOLS.find((x) => x.id === row[3]) : null;
      h += '<div class="tli"><div class="tly mono">' + esc(row[0]) + '</div><div class="tldot"></div>' +
        '<div class="tlb"><div class="tlt">' + esc(row[1]) + '</div>' +
        '<div class="tlx">' + esc(row[2]) + '</div>' +
        (p ? '<button class="chip sm" data-act="proto-jump" data-id="' + p.id + '">' +
          esc(p.abbr === p.name ? p.name : p.abbr + ' · ' + p.name) + '</button>' : '') +
        '</div></div>';
    });
    h += '</div></div>';
    return h;
  }

  /* ---------------- command palette ---------------- */
  const P = { open: false, q: '', items: [], sel: 0 };

  function search(q) {
    const s = q.trim().toLowerCase();
    const out = [];
    if (!s) {
      out.push({ kind: 'cmd', label: 'Course overview', sub: 'Start here', act: 'view', v: 'tour', icon: 'home' });
      out.push({ kind: 'cmd', label: 'Device lab', sub: 'Inspect any device', act: 'view', v: 'lab', icon: 'grid' });
      out.push({ kind: 'cmd', label: 'Exam mode', sub: 'Timed mixed quiz', act: 'view', v: 'exam', icon: 'list' });
      out.push({ kind: 'cmd', label: 'Protocol timeline', sub: 'History of the internet', act: 'view', v: 'timeline', icon: 'book' });
      return out;
    }
    const hit = (txt) => txt && txt.toLowerCase().indexOf(s) >= 0;
    LESSONS.forEach((l) => {
      if (hit(l.title) || hit(l.subtitle) || hit(l.goals.join(' '))) {
        out.push({ kind: 'lesson', label: l.title, sub: 'Lesson · ' + U.trackOf[l.track].title, act: 'lesson', id: l.id });
      }
      l.steps.forEach((st, i) => {
        if (hit(st.title) || hit(st.what)) out.push({ kind: 'step', label: st.title, sub: 'Step ' + (i + 1) + ' · ' + l.title, act: 'lesson-step', id: l.id, step: i });
      });
    });
    D.PROTOCOLS.forEach((p) => {
      if (hit(p.name) || hit(p.abbr) || hit(p.summary)) out.push({ kind: 'proto', label: p.name + ' (' + p.abbr + ')', sub: 'Protocol · layer ' + p.layer + ' · ' + p.rfc, act: 'proto-jump', id: p.id });
    });
    const terms = [];
    LESSONS.forEach((l) => l.steps.forEach((st) => (st.terms || []).forEach((tm) => {
      if (!terms.find((x) => x.t.toLowerCase() === tm.t.toLowerCase())) terms.push(tm);
    })));
    (D.GLOSSARY_EXTRA || []).forEach((tm) => { if (!terms.find((x) => x.t.toLowerCase() === tm.t.toLowerCase())) terms.push(tm); });
    terms.forEach((g) => {
      if (hit(g.t)) out.push({ kind: 'term', label: g.t, sub: 'Glossary · ' + String(g.d).slice(0, 70), act: 'glossary', id: g.t });
    });
    return out.slice(0, 40);
  }

  function paletteEl() {
    let el = document.getElementById('palette');
    if (!el) {
      el = document.createElement('div');
      el.id = 'palette';
      el.className = 'palette';
      el.innerHTML = '<div class="palbox"><div class="palinput">' + ICON.search +
        '<input id="palin" type="text" placeholder="Search lessons, steps, protocols, terms…" autocomplete="off" spellcheck="false"></div>' +
        '<div id="palres" class="palres"></div>' +
        '<div class="palfoot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div>';
      document.body.appendChild(el);
      const inp = el.querySelector('#palin');
      inp.addEventListener('input', () => {
        P.q = inp.value;
        P.items = search(P.q);
        P.sel = 0;
        paintPalette();
      });
    }
    return el;
  }

  function paintPalette() {
    const box = document.getElementById('palres');
    if (!box) return;
    if (!P.items.length) { box.innerHTML = '<div class="palempty">Nothing matched. Try “TLS”, “conntrack”, “subnet”, “handshake”.</div>'; return; }
    let h = '';
    P.items.forEach((it, i) => {
      h += '<button class="palitem' + (i === P.sel ? ' on' : '') + '" data-pal="' + i + '">' +
        '<span class="palk">' + esc(it.kind) + '</span><span class="pall">' + esc(it.label) + '</span>' +
        '<span class="pals">' + esc(it.sub) + '</span></button>';
    });
    box.innerHTML = h;
  }

  function paletteOpen(initial) {
    const el = paletteEl();
    P.q = initial || '';
    P.items = search(P.q);
    P.sel = 0;
    el.classList.add('on');
    P.open = true;
    const inp = el.querySelector('#palin');
    inp.value = P.q;
    paintPalette();
    setTimeout(() => inp.focus(), 10);
  }
  function paletteClose() {
    const el = document.getElementById('palette');
    if (el) el.classList.remove('on');
    P.open = false;
  }
  function paletteRun(i) {
    const it = P.items[i];
    if (!it) return;
    paletteClose();
    if (it.act === 'view') { S.view = it.v; S.search = ''; root.PE_APP.render(); return; }
    if (it.act === 'lesson') { root.PE_APP.goLesson(it.id); return; }
    if (it.act === 'lesson-step') { root.PE_APP.goLesson(it.id, it.step); return; }
    if (it.act === 'proto-jump') { S.view = 'library'; S.lib = it.id; S.search = ''; root.PE_APP.render(); return; }
    if (it.act === 'glossary') { S.view = 'glossary'; S.search = it.id; root.PE_APP.render(); return; }
  }

  document.addEventListener('keydown', (ev) => {
    const k = ev.key;
    if ((ev.metaKey || ev.ctrlKey) && (k === 'k' || k === 'K')) {
      ev.preventDefault();
      if (P.open) paletteClose(); else paletteOpen('');
      return;
    }
    if (k === '/' && !P.open) {
      const tag = (ev.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      ev.preventDefault();
      paletteOpen('');
      return;
    }
    if (!P.open) return;
    if (k === 'Escape') { ev.preventDefault(); paletteClose(); return; }
    if (k === 'ArrowDown') { ev.preventDefault(); P.sel = Math.min(P.items.length - 1, P.sel + 1); paintPalette(); return; }
    if (k === 'ArrowUp') { ev.preventDefault(); P.sel = Math.max(0, P.sel - 1); paintPalette(); return; }
    if (k === 'Enter') { ev.preventDefault(); paletteRun(P.sel); return; }
  }, true);

  document.addEventListener('click', (ev) => {
    const pal = ev.target.closest('[data-pal]');
    if (pal) { paletteRun(parseInt(pal.getAttribute('data-pal'), 10)); return; }
    const el = document.getElementById('palette');
    if (el && el.classList.contains('on') && ev.target === el) paletteClose();
  });

  root.PE_EXTRA = { renderExam, renderTimeline, examStart, examAnswer, examSkip, examBack, examFinish, examReset, paletteOpen, paletteClose };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
   app.js — router, events, keyboard
   ============================================================ */
(function (root) {
  'use strict';
  const U = root.PE_UI;
  const { S, byId, esc } = U;

  function curLesson() { return byId[S.lessonId]; }

  function render(keepScroll) {
    const view = document.getElementById('view');
    const scrollTop = view.scrollTop;
    U.renderSidebar();
    U.renderTopbar();

    if (S.view === 'tour') {
      view.innerHTML = root.PE_TOUR.render();
    } else if (S.view === 'lesson') {
      const l = curLesson();
      S.step = Math.max(0, Math.min(S.step, l.steps.length - 1));
      view.innerHTML = root.PE_LESSON.render();
      root.PE_LESSON.afterRender();
    } else if (S.view === 'lab') {
      view.innerHTML = root.PE_LAB.render();
      root.PE_LAB.afterRender();
    } else if (S.view === 'library') {
      view.innerHTML = root.PE_REF.library();
    } else if (S.view === 'sources') {
      view.innerHTML = root.PE_SOURCES.render();
    } else if (S.view === 'glossary') {
      view.innerHTML = root.PE_REF.glossary();
    } else if (S.view === 'cheatsheet') {
      view.innerHTML = root.PE_REF.cheatsheet();
    } else if (S.view === 'exam') {
      view.innerHTML = root.PE_EXTRA.renderExam();
    } else if (S.view === 'timeline') {
      view.innerHTML = root.PE_EXTRA.renderTimeline();
    }
    if (keepScroll) view.scrollTop = scrollTop; else view.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function goLesson(id, step) {
    if (!byId[id]) return;
    S.view = 'lesson';
    S.lessonId = id;
    S.step = step || 0;
    S.sel = null;
    S.playing = false;
    S.peek = false;
    U.save();
    render();
  }

  function nextLessonId() {
    const i = U.LESSONS.indexOf(curLesson());
    return (U.LESSONS[i + 1] || {}).id;
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) {
      if (S.menu && !ev.target.closest('#sidebar') && !ev.target.closest('[data-act="menu"]')) {
        S.menu = false;
        document.getElementById('sidebar').classList.remove('open');
      }
      return;
    }
    const act = el.getAttribute('data-act');
    const L = root.PE_LESSON;

    switch (act) {
      case 'menu':
        S.menu = !S.menu;
        document.getElementById('sidebar').classList.toggle('open', S.menu);
        break;

      case 'view':
        S.view = el.getAttribute('data-v');
        S.search = '';
        S.menu = false;
        render();
        break;

      case 'lesson':
      case 'openLesson':
        goLesson(el.getAttribute('data-id'));
        break;

      case 'openNextLesson': {
        const n = nextLessonId();
        if (n) goLesson(n); else U.toast('That was the last lesson — try the Device lab next.');
        break;
      }
      case 'nextLesson': {
        const n = nextLessonId();
        if (n) goLesson(n); else U.toast('No more lessons after this one.');
        break;
      }
      case 'prev': {
        const i = U.LESSONS.indexOf(curLesson());
        if (i > 0) goLesson(U.LESSONS[i - 1].id);
        break;
      }

      case 'step': {
        const i = parseInt(el.getAttribute('data-i'), 10);
        const l = curLesson();
        if (isNaN(i) || i < 0 || i >= l.steps.length) break;
        S.step = i;
        S.sel = null;
        S.playing = false;
        L.LS.hl = null;
        U.markStep(l, i);
        render();
        break;
      }
      case 'replay': {
        const sess = L.session(curLesson());
        L.animate(sess, S.step);
        break;
      }
      case 'play':
        S.playing = !S.playing;
        render(true);
        break;
      case 'speed':
        S.speed = parseFloat(el.getAttribute('data-v'));
        render(true);
        break;
      case 'peek':
        S.peek = !S.peek;
        render(true);
        break;

      case 'packet': {
        S.sel = parseInt(el.getAttribute('data-i'), 10);
        L.LS.hl = null;
        L.refreshInspector();
        const rows = document.querySelectorAll('table.pcap tr');
        rows.forEach((r) => r.classList.remove('sel'));
        if (el.tagName === 'TR') el.classList.add('sel');
        break;
      }
      case 'layer': {
        const i = el.getAttribute('data-i');
        L.LS.open[i] = L.LS.open[i] !== false ? false : true;
        L.refreshInspector();
        break;
      }
      case 'field': {
        const off = parseInt(el.getAttribute('data-off'), 10);
        const len = parseInt(el.getAttribute('data-len'), 10);
        L.LS.hl = { off, len };
        L.refreshInspector();
        break;
      }
      case 'quiz': {
        const q = parseInt(el.getAttribute('data-q'), 10);
        const o = parseInt(el.getAttribute('data-o'), 10);
        S.quiz[S.lessonId] = S.quiz[S.lessonId] || {};
        if (S.quiz[S.lessonId][q] !== undefined) break;
        S.quiz[S.lessonId][q] = o;
        U.save();
        render(true);
        break;
      }
      case 'complete': {
        const l = curLesson();
        if (U.isDone(l)) { delete S.done[l.id]; }
        else { S.done[l.id] = 'done'; U.toast('Lesson marked complete'); }
        U.save();
        render(true);
        break;
      }
      case 'reset':
        if (confirm('Reset all lesson progress?')) {
          S.done = {}; S.quiz = {};
          U.save(); render();
        }
        break;

      /* ---- device lab ---- */
      case 'lab-topo':
        S.lab.topo = el.getAttribute('data-v');
        S.lab.device = null;
        S.lab.tab = 'overview';
        S.view = 'lab';
        render();
        break;
      case 'lab-device':
        S.lab.device = el.getAttribute('data-id');
        root.PE_LAB.cliReset();
        render();
        break;
      case 'lab-tab':
        S.lab.tab = el.getAttribute('data-t');
        render(true);
        break;
      case 'lab-trace':
        S.lab.traceTarget = el.getAttribute('data-id');
        render(true);
        break;
      case 'cli-run':
        S.lab.tab = 'cli';
        render(true);
        setTimeout(() => root.PE_LAB.submit(el.getAttribute('data-cmd')), 30);
        break;
      case 'cli-submit':
        ev.preventDefault();
        break;

      /* ---- reference ---- */
      case 'proto': {
        const id = el.getAttribute('data-id');
        S.lib = id === S.lib ? null : id;
        render();
        if (S.lib) {
          const d = document.getElementById('proto-detail');
          if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        break;
      }
      case 'exam-scope':
        S.exam.scope = el.getAttribute('data-v');
        render(true);
        break;
      case 'exam-size':
        S.exam.n = parseInt(el.getAttribute('data-v'), 10) || 12;
        render(true);
        break;
      case 'exam-start':
        root.PE_EXTRA.examStart();
        break;
      case 'exam-answer':
        root.PE_EXTRA.examAnswer(parseInt(el.getAttribute('data-o'), 10));
        break;
      case 'exam-skip':
        root.PE_EXTRA.examSkip();
        break;
      case 'exam-back':
        root.PE_EXTRA.examBack();
        break;
      case 'exam-finish':
        root.PE_EXTRA.examFinish();
        break;
      case 'exam-again':
        root.PE_EXTRA.examReset();
        break;
      case 'palette':
        ev.preventDefault();
        root.PE_EXTRA.paletteOpen('');
        break;
      case 'proto-jump':
        S.view = 'library';
        S.lib = el.getAttribute('data-id');
        S.search = '';
        render();
        break;
      case 'glossary':
        S.view = 'glossary';
        S.search = el.getAttribute('data-id') || '';
        render();
        break;

      case 'dev':
        S.view = 'lab';
        S.lab.device = el.getAttribute('data-id');
        S.lab.tab = 'overview';
        root.PE_LAB.cliReset();
        render();
        break;
    }
  });

  /* device nodes on the canvas */
  document.addEventListener('click', (ev) => {
    const node = ev.target.closest('.node[data-dev]');
    if (!node) return;
    const sess = root.PE_LESSON.session(byId[S.lessonId]);
    S.view = 'lab';
    S.lab.topo = sess.topo.id || 'home';
    S.lab.device = node.getAttribute('data-dev');
    S.lab.tab = 'overview';
    root.PE_LAB.cliReset();
    U.toast('Opened ' + (root.PE_TOPO.TOPOLOGIES[S.lab.topo].devices.find((d) => d.id === node.getAttribute('data-dev')) || {}).label);
    render();
  });

  /* cli form + search inputs */
  document.addEventListener('submit', (ev) => {
    const f = ev.target;
    if (f.id === 'cliform') {
      ev.preventDefault();
      const inp = document.getElementById('cliin');
      const cmd = inp.value;
      inp.value = '';
      root.PE_LAB.submit(cmd);
    }
  });

  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'libsearch' || ev.target.id === 'glsearch' || ev.target.id === 'srcsearch') {
      S.search = ev.target.value;
      const sel = document.activeElement;
      render(true);
      const again = document.getElementById(sel.id);
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }
  });

  /* keyboard */
  document.addEventListener('keydown', (ev) => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') {
      if (ev.key === 'ArrowUp' && ev.target.id === 'cliin') {
        ev.preventDefault();
        const C = root.PE_LAB.CLI;
        if (C.hist.length) { C.hi = Math.max(0, C.hi - 1); ev.target.value = C.hist[C.hi] || ''; }
      } else if (ev.key === 'ArrowDown' && ev.target.id === 'cliin') {
        ev.preventDefault();
        const C = root.PE_LAB.CLI;
        C.hi = Math.min(C.hist.length, C.hi + 1);
        ev.target.value = C.hist[C.hi] || '';
      }
      return;
    }
    if (S.view !== 'lesson') return;
    const l = curLesson();
    if (ev.key === 'ArrowRight') {
      ev.preventDefault();
      if (S.step < l.steps.length - 1) { S.step += 1; S.sel = null; U.markStep(l, S.step); render(true); }
    } else if (ev.key === 'ArrowLeft') {
      ev.preventDefault();
      if (S.step > 0) { S.step -= 1; S.sel = null; render(true); }
    } else if (ev.key === ' ') {
      ev.preventDefault();
      S.playing = !S.playing;
      render(true);
    } else if (/^[1-9]$/.test(ev.key)) {
      const i = parseInt(ev.key, 10) - 1;
      if (i < l.steps.length) { S.step = i; S.sel = null; U.markStep(l, i); render(true); }
    }
  });

  window.addEventListener('resize', () => {
    if (S.view === 'lesson' && root.PE_LESSON) root.PE_LESSON.onResize();
  });

  /* boot */
  U.load();
  root.PE_APP = { render, goLesson };
  render();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
