<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Protocol Explorer · Learn the internet packet by packet</title>
<meta name="description" content="A guided, hands-on course on how the internet works: packets, addressing, DHCP, ARP, DNS, TCP, HTTP, NAT, TLS, certificates, SSH, email, FTP, UDP/QUIC, ICMP, BGP and diagnosis — with a real packet inspector and inspectable devices." />
<style>
/* ============================================================
   Protocol Explorer — design system (light, beginner-first)
   ============================================================ */
:root{
  --bg:#f5f7fc;
  --bg2:#eef2f9;
  --panel:#ffffff;
  --panel2:#f8fafd;
  --panel3:#eef2f9;
  --line:#e4e9f2;
  --line2:#d5dde9;
  --text:#152037;
  --text2:#33415c;
  --muted:#64748b;
  --dim:#8b97ab;
  --accent:#4f46e5;
  --accent-soft:#eef0fe;
  --accent2:#0d9488;
  --ok:#0e9f6e;
  --warn:#b45309;
  --bad:#dc2626;
  --r:14px;
  --r-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 28px -22px rgba(16,24,40,.5);
  --shadow-lg:0 20px 60px -30px rgba(16,24,40,.45);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sbw:278px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd,pre{font-family:var(--mono)}
kbd{background:#fff;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;color:var(--text2)}
::selection{background:#dfe3ff}

/* scrollbars */
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:#cfd8e6;border-radius:9px;border:2px solid var(--bg)}
.scroll::-webkit-scrollbar-thumb:hover{background:#b9c4d6}

/* ============================================================
   shell
   ============================================================ */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh;background:var(--bg)}

.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:#fff;border-right:1px solid var(--line);z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand svg{flex:0 0 auto;border-radius:11px;box-shadow:0 6px 18px -10px rgba(79,70,229,.7)}
.brand .name{font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--text)}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}

.sidebar-scroll{flex:1;min-height:0;padding:2px 12px 20px}
.navgroup{margin-top:16px}
.navgroup > .gt{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  padding:0 8px 8px;font-weight:700
}
.navitem{
  display:flex;gap:10px;align-items:center;width:100%;text-align:left;
  padding:8px 10px;border-radius:10px;color:var(--text2);font-size:13.5px;line-height:1.35;
  transition:background .13s,color .13s;margin-bottom:1px
}
.navitem:hover{background:var(--panel3);color:var(--text)}
.navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.navitem.active:before{content:none}
.navitem .num{
  flex:0 0 22px;height:22px;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-family:var(--mono);background:var(--panel3);color:var(--muted);font-weight:600
}
.navitem.active .num{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1px #dcdcfb}
.navitem.done .num{background:#e6f7f0;color:var(--ok)}
.navitem .lbl{flex:1;min-width:0}
.navitem .chk{color:var(--ok);font-size:12px}
.trackbar{height:5px;border-radius:99px;background:var(--panel3);margin:5px 10px 10px;overflow:hidden}
.trackbar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.side-foot{
  padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);
  display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fcfdff
}

.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:11px 26px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px)
}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;flex-wrap:nowrap;overflow:hidden}
.crumbs > *{flex:0 0 auto}
.crumbs b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.crumbs b{color:var(--text);font-weight:650}
.topbar .spacer{flex:1}
.menubtn{display:none}
.view{padding:26px 26px 80px;max-width:1560px;width:100%;margin:0 auto}

/* ============================================================
   buttons & small bits
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--line2);background:#fff;color:var(--text2);
  font-size:13px;font-weight:600;transition:.14s;white-space:nowrap;box-shadow:0 1px 1px rgba(16,24,40,.03)
}
.btn:hover{background:var(--panel3);color:var(--text);border-color:#c3cddd}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px -12px rgba(79,70,229,.9)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--panel3)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.lg{padding:12px 20px;font-size:14.5px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.icobtn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--line2);background:#fff;color:var(--text2);transition:.14s
}
.icobtn:hover{background:var(--panel3);color:var(--text)}
.icobtn svg{width:16px;height:16px}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;letter-spacing:.01em;border:1px solid var(--line2);
  background:#fff;color:var(--text2)
}
.chip.mono{font-family:var(--mono);font-weight:500;font-size:11px}
.chip.sm{font-size:10.5px;padding:2px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.danger{color:var(--bad)!important}
.warn{color:var(--warn)!important}
.spacer{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button.chip{cursor:pointer;transition:.12s}
button.chip:hover{border-color:#b9c4d6;color:var(--text)}
button.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fine{font-size:12px;color:var(--dim);margin-top:10px}
.page{max-width:1140px;margin:0 auto}
.page.narrow{max-width:880px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.lead{color:var(--text2);font-size:16px;line-height:1.65;margin:10px 0 22px;max-width:72ch}
h1{font-size:32px;letter-spacing:-.03em;font-weight:750;line-height:1.2}
h2{font-size:22px;letter-spacing:-.02em;font-weight:700}

/* ============================================================
   panels & cards
   ============================================================ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel + .panel{margin-top:16px}
.panel > .hd{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
  font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;
  background:#fcfdff;border-radius:var(--r) var(--r) 0 0
}
.panel > .hd .spacer{flex:1}
.panel > .bd{padding:16px}
.panel-h{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text2)}
.panel-h b{font-size:13.5px;color:var(--text)}
.panel-b{padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.pcard{
  text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);
  background:#fff;transition:.16s;position:relative;overflow:hidden;box-shadow:var(--shadow)
}
.pcard:hover{border-color:#c9d1e2;transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.pcard .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.pcard .ab{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;color:#fff;background:var(--accent)}
.pcard h4{font-size:15px;letter-spacing:-.01em;font-weight:650}
.pcard .sm{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.55}
.pcard .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.pcard .ft span{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px;background:var(--panel2)}
.gl{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;box-shadow:var(--shadow)}
.gl b{font-size:13.5px}
.gl p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}
.searchbox{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);background:#fff;border-radius:11px;padding:9px 13px;max-width:440px;box-shadow:var(--shadow)}
.searchbox input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:14px;font-family:inherit}
.searchbox svg{color:var(--dim)}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 18px;flex-wrap:wrap}
.sectionhead h2{font-size:23px}
.sectionhead p{color:var(--muted);font-size:14px;margin-top:4px}
.ring{
  --p:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-family:var(--mono);color:var(--text2);font-weight:600;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),#e7ecf5 0);position:relative;flex:0 0 auto
}
.ring:before{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}
.ring span{position:relative}
.datacard{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;background:#fff}
.datacard .hd{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text2)}
.datacard table{width:100%;border-collapse:collapse;font-size:13px}
.datacard th{text-align:left;padding:8px 14px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:#fcfdff;border-bottom:1px solid var(--line)}
.datacard td{padding:8px 14px;border-bottom:1px solid #eef2f8;color:var(--text2)}
.datacard td:first-child{color:var(--text);font-weight:550}
.datacard tr:last-child td{border-bottom:0}
.datacard .nt{padding:10px 14px;font-size:12.5px;color:var(--muted);background:var(--panel2);border-top:1px solid var(--line);line-height:1.55}

/* ============================================================
   lesson: header, steps, explanation
   ============================================================ */
.lesson-head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-bottom:16px}
.lesson-head .t1{font-size:29px;font-weight:750;letter-spacing:-.03em;line-height:1.2}
.lesson-head .t2{color:var(--muted);margin-top:6px;font-size:15px;max-width:66ch}
.headmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.goals{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.goal{font-size:12px;color:var(--text2);border:1px solid var(--line2);border-radius:99px;padding:3px 10px;background:#fff}
.goal:before{content:"✓ ";color:var(--accent);font-weight:700}

.pips{display:flex;gap:7px;flex-wrap:wrap;padding:2px 2px 10px;margin-bottom:6px}
.pips::-webkit-scrollbar{display:none}
.pip{
  display:flex;align-items:center;gap:8px;padding:7px 13px 7px 7px;border-radius:99px;
  border:1px solid var(--line);background:#fff;white-space:nowrap;transition:.14s;box-shadow:var(--shadow)
}
.pip b{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-family:var(--mono);background:var(--panel3);color:var(--muted)
}
.pip span{font-size:12.5px;color:var(--text2);max-width:190px;overflow:hidden;text-overflow:ellipsis}
.pip:hover{border-color:#c3cddd}
.pip.done b{background:#e6f7f0;color:var(--ok)}
.pip.active{border-color:var(--accent);background:var(--accent-soft)}
.pip.active b{background:var(--accent);color:#fff}
.pip.active span{color:var(--accent);font-weight:650}

.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

.explain{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px}
.explain .eyebrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);letter-spacing:.1em;margin-bottom:10px}
.explain h3{font-size:24px;letter-spacing:-.025em;line-height:1.25;font-weight:750}
.explain .sub{color:var(--accent);font-size:14.5px;margin-top:6px;font-weight:550}
.qa{margin-top:18px;padding-left:14px;border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 85%);border-radius:0 10px 10px 0;padding:12px 14px}
.qa .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:750;margin-bottom:5px}
.qa .k:before{content:"● ";font-size:8px;vertical-align:middle}
.qa p{font-size:15px;color:var(--text2);line-height:1.68}
.qa.why{border-left-color:var(--accent2);background:linear-gradient(90deg,#e6f7f5,transparent 85%)}
.qa.why .k{color:var(--accent2)}
.qa.analogy{border-left-color:#e0a800;background:linear-gradient(90deg,#fdf6e3,transparent 85%)}
.qa.analogy .k{color:#a16207}
.qa.analogy p{font-style:italic;color:#5a5232}
.terms{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.term{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.6}
.term b{color:var(--text);font-weight:650}
.term span{color:var(--text2)}
.emptynote{
  margin-top:16px;padding:13px 15px;border-radius:12px;border:1px dashed var(--line2);
  background:var(--panel2);font-size:13.5px;color:var(--muted);line-height:1.6
}
.navrow{display:flex;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.navrow .btn{flex:1;justify-content:center;padding:11px 16px;font-size:13.5px}

/* sticky lesson footer nav */
.lessonnav{
  position:sticky;bottom:0;z-index:25;margin:18px -26px -80px;padding:12px 26px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap
}
.lessonnav .lbl{font-size:13px;color:var(--muted)}
.lessonnav .lbl b{color:var(--text)}
.lessonnav .track{flex:1;height:6px;border-radius:99px;background:var(--panel3);overflow:hidden;min-width:90px;max-width:320px}
.lessonnav .track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* ============================================================
   canvas / diagram
   ============================================================ */
.canvaswrap{padding:12px}
.canvas{
  position:relative;width:100%;height:424px;border-radius:12px;overflow:hidden;
  background:
    radial-gradient(600px 240px at 80% -10%,#eef2ff,transparent 70%),
    radial-gradient(500px 260px at 8% 110%,#eafaf7,transparent 65%),
    linear-gradient(180deg,#fbfcff,#f4f7fc);
  border:1px solid var(--line)
}
.canvas:before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(#dfe6f1 1px,transparent 1px);
  background-size:22px 22px;opacity:.75
}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.canvas .link{stroke:#ccd8e8;stroke-width:2.2;stroke-linecap:round}
.canvas .link.hot{stroke-width:3;stroke-linecap:round}
.canvas .link.path{stroke-width:4.5;stroke-linecap:round;stroke-dasharray:8 7;animation:flow 1s linear infinite;filter:drop-shadow(0 1px 2px rgba(15,23,41,.14))}
@keyframes flow{to{stroke-dashoffset:-13}}
.node{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:6px 8px 7px;border-radius:12px;border:1px solid var(--line);background:#fff;
  cursor:pointer;transition:.16s;min-width:58px;max-width:104px;box-shadow:0 2px 6px rgba(16,24,40,.07);z-index:2
}
.node .bx{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--panel3);color:var(--text2);transition:.16s
}
.node .bx svg{width:19px;height:19px}
.node .nm{font-size:11px;font-weight:650;color:var(--text);text-align:center;line-height:1.22;max-width:96px;hyphens:auto}
.node .ip{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.node:hover{border-color:var(--accent);box-shadow:0 10px 24px -14px rgba(79,70,229,.9);transform:translate(-50%,-50%) translateY(-2px)}
.node.focus{border-color:#c7cbfb;background:#fff}
.node.focus .bx{background:var(--accent-soft);color:var(--accent)}
.node.dim{background:#fbfcfe;border-color:#e9eef6;box-shadow:none}
.node.dim .bx{background:#f2f5fa;color:#9aa8bd}
.node.dim .nm{color:#8c99ad;font-weight:600}
.node.dim .ip{color:#b6c1d1}
.node.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.16)}
.node.through .bx{background:#dbeafe;color:#1d4ed8}
.node.arrive{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(13,148,136,.18)}
.node .badge{position:absolute;top:-7px;right:-7px;font-size:9px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px}
.pktdot{
  position:absolute;width:14px;height:14px;border-radius:50%;left:0;top:0;z-index:9;
  transition:none;pointer-events:none
}
.pktdot.dead{background:none!important;box-shadow:none!important;color:var(--bad);font-size:16px;font-weight:800;width:auto;height:auto;line-height:1}
.pktdot.gone{opacity:0;transition:opacity .35s}
.canvas .legend{
  position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:10.5px;color:var(--text2);z-index:3
}
.canvas .legend span{display:flex;align-items:center;gap:5px}
.canvas .hint{
  position:absolute;right:10px;bottom:10px;font-size:10.5px;color:var(--dim);
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:5px 9px;z-index:3
}
.playbar{display:flex;align-items:center;gap:9px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fcfdff;border-radius:0 0 var(--r) var(--r)}
.playbar .spacer{flex:1}
.speed{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#fff}
.speed button{padding:4px 9px;font-size:11.5px;color:var(--muted);border-right:1px solid var(--line)}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.routecrumb{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 16px;
  border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--text2)
}
.rc-lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:750}
.rc-path{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rc-path b{font-weight:650;color:var(--text)}
.rc-path i{color:var(--dim);font-style:normal}
.rc-hint{color:var(--muted);font-size:11.5px;margin-left:auto}

/* ============================================================
   packet table
   ============================================================ */
.pcaplist{max-height:290px;overflow:auto}
table.pcap{width:100%;border-collapse:collapse;font-size:12px}
table.pcap th{
  position:sticky;top:0;background:#f7f9fd;text-align:left;padding:8px 10px;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);z-index:1
}
table.pcap td{padding:6px 10px;border-bottom:1px solid #eef2f8;color:var(--text2);vertical-align:top}
table.pcap tbody tr{cursor:pointer;transition:.1s}
table.pcap tbody tr:hover td{background:#f6f8ff}
table.pcap tr.sel td{background:var(--accent-soft);color:var(--text)}
table.pcap tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.pcap tr.future td{opacity:.42}
table.pcap tr.dropped td{color:var(--bad)}
table.pcap .no{font-family:var(--mono);font-size:11px;color:var(--dim)}
table.pcap .info{display:block;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-no{width:36px}.c-t{width:60px}.c-s{width:120px}.c-d{width:120px}.c-p{width:72px}.c-z{width:66px}
.tagp{
  display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.02em;
  padding:2px 6px;border-radius:6px;border:1px solid transparent;white-space:nowrap
}

/* ============================================================
   inspector
   ============================================================ */
.insp-head{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fcfdff;border-radius:var(--r) var(--r) 0 0}
.insp-head .pt{font-size:13px;font-weight:650;color:var(--text)}
.insp-head .spacer{flex:1}
.insp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0}
.insp .col{padding:12px 14px;min-width:0}
.insp .col + .col{border-left:1px solid var(--line);background:#fafcff}
.layertree{display:flex;flex-direction:column;gap:7px}
.layer{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.layer > .lh{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;background:var(--panel2)}
.layer > .lh:hover{background:var(--panel3)}
.layer > .lh .caret{font-size:9px;color:var(--dim);transition:transform .15s}
.layer.open > .lh .caret{transform:rotate(90deg)}
.layer > .lh .nm{font-size:12.5px;font-weight:650;color:var(--text);flex:1}
.layer > .lh .ln{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.layer .fl{display:none;padding:4px 0}
.layer.open .fl{display:block}
.frow{display:grid;grid-template-columns:minmax(110px,1.2fr) minmax(0,1.4fr) 44px;gap:9px;padding:4px 11px;font-size:12px;cursor:pointer;border-left:2px solid transparent}
.frow:hover{background:#f6f8ff}
.frow.hl{background:var(--accent-soft);border-left-color:var(--accent)}
.frow .fn{color:var(--muted)}
.frow .fv{font-family:var(--mono);font-size:11.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fo{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right}
.decode{margin:10px 0 0;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#f8fafd;font-size:13px;color:var(--text2);line-height:1.65}
.decode b{color:var(--text)}
.hexw{
  font-family:var(--mono);font-size:11.5px;line-height:1.75;background:#0f1729;color:#c8d6ea;
  border-radius:11px;padding:12px 13px;overflow-x:auto;border:1px solid #1c2942
}
.hexline{white-space:pre;display:flex;gap:10px}
.hexline .of{color:#5b7292}
.hexline .hb{color:#9fd2ff;flex:1}
.hexline .as{color:#6f8fb0}
.hexline .hb b,.hexline .as b{color:#fff;background:#3b62a8;border-radius:3px;padding:0 1px}
.empty{padding:26px 18px;text-align:center;color:var(--dim);font-size:13px}

/* ============================================================
   quiz
   ============================================================ */
.quiz .q{font-size:14.5px;font-weight:650;margin:4px 0 10px;color:var(--text);line-height:1.5}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:11px 14px;
  border-radius:11px;border:1px solid var(--line2);background:#fff;color:var(--text2);
  font-size:13.5px;line-height:1.5;transition:.13s;margin-bottom:8px
}
.opt:hover{border-color:#b9c4d6;background:var(--panel2)}
.opt .b,.opt .key{
  flex:0 0 22px;height:22px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:700;background:var(--panel3);color:var(--muted)
}
.opt.right{border-color:#8fdcbf;background:#effaf5;color:#065f46}
.opt.right .b,.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:#fbc4c4;background:#fef2f2;color:#991b1b}
.opt.wrong .b,.opt.wrong .key{background:var(--bad);color:#fff}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.on .key{background:var(--accent);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:hover{background:inherit}
.why{font-size:13px;color:var(--text2);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-top:2px;line-height:1.6}
.lessondone{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* ============================================================
   device lab
   ============================================================ */
.labgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.devlist{display:flex;flex-direction:column;gap:3px}
.devrow{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  border:1px solid transparent;text-align:left;width:100%;color:var(--text2);transition:.13s
}
.devrow:hover{background:var(--panel3);color:var(--text)}
.devrow.on{background:var(--accent-soft);border-color:#dcdcfb;color:var(--accent)}
.devrow .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--panel3);color:var(--text2);flex:0 0 auto}
.devrow.on .ico{background:#fff;color:var(--accent)}
.devrow .ico svg{width:16px;height:16px}
.devrow .nm{font-size:13px;font-weight:600;line-height:1.25}
.devrow .ip{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;background:#fcfdff;border-radius:var(--r) var(--r) 0 0}
.tabs button{padding:11px 13px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:.13s;font-weight:600}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.seg button{padding:6px 11px;font-size:12px;color:var(--muted);border-right:1px solid var(--line);font-weight:600}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel3);color:var(--text)}
.seg button.on{background:var(--accent);color:#fff}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;color:var(--text);word-break:break-word}
table.grid{width:100%;border-collapse:collapse;font-size:12px}
table.grid th{text-align:left;padding:7px 10px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:#fcfdff;font-weight:700}
table.grid td{padding:6px 10px;border-bottom:1px solid #eef2f8;font-family:var(--mono);font-size:11.5px;color:var(--text2)}
table.grid tr:hover td{background:#f6f8ff}
table.grid td.hi{color:var(--text);font-weight:600}
.cli{background:#0f1729;border:1px solid #1c2942;border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:12.5px}
.cli .out{padding:14px;height:330px;overflow:auto;white-space:pre-wrap;color:#a7f3d0;line-height:1.65}
.cli .out .cmdline{color:#93c5fd}
.cli .out .err{color:#fca5a5}
.cli .out .mut{color:#7c8fa8}
.cli form{display:flex;align-items:center;gap:9px;border-top:1px solid #1c2942;padding:9px 13px;background:#0b1220}
.cli .ps1{color:#4ade80;font-size:12px;white-space:nowrap}
.cli input{flex:1;background:none;border:0;outline:0;color:#e2e8f0;font-family:var(--mono);font-size:12.5px}
.cli .hints{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-top:1px solid #1c2942;background:#0b1220}
.cli .hints button{font-family:var(--mono);font-size:10.5px;color:#94a3b8;border:1px solid #24324c;border-radius:7px;padding:3px 8px}
.cli .hints button:hover{color:#fff;border-color:#3b4a66;background:#16203a}
.trace{display:flex;flex-direction:column;gap:0}
.hoprow{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 66px;gap:12px;align-items:center;padding:8px 6px;border-bottom:1px solid #eef2f8;font-size:13px}
.hoprow .h-n{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.hoprow .h-nm{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoprow .h-ip{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hoprow .h-ms{font-family:var(--mono);font-size:11px;color:var(--ok);text-align:right}
.hoprow.dim{opacity:.45}

/* ============================================================
   exam / timeline / palette / toast
   ============================================================ */
.exambar{
  display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);
  border-radius:12px;background:#fff;margin-bottom:22px;box-shadow:var(--shadow)
}
.exprog{display:flex;gap:4px;flex:0 1 auto;flex-wrap:wrap}
.exprog i{width:15px;height:6px;border-radius:3px;background:var(--panel3);display:block}
.exprog i.on{background:var(--accent)}
.exprog i.cur{background:var(--text);box-shadow:0 0 0 2px #cfd8e6}
#examclock{font-size:17px;font-weight:750;color:var(--text);letter-spacing:.02em}
.qstem{font-size:23px;line-height:1.42;letter-spacing:-.02em;margin:8px 0 20px;max-width:62ch;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.tkrows{display:flex;flex-direction:column;gap:10px}
.tkrow{display:grid;grid-template-columns:10px minmax(120px,200px) minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:13px}
.tkrow .nm{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkrow .bar{height:7px;border-radius:4px;background:var(--panel3);overflow:hidden}
.tkrow .bar i{display:block;height:100%;border-radius:4px}
.tkrow .mono{text-align:right;font-size:11.5px;color:var(--muted)}
.revlist{display:flex;flex-direction:column;gap:11px}
.rev{border:1px solid var(--line);border-left-width:4px;border-radius:11px;padding:13px 15px;background:#fff}
.rev.ok{border-left-color:var(--ok);background:#fbfefc}
.rev.bad{border-left-color:var(--bad);background:#fffbfb}
.revq{display:flex;gap:10px;font-size:13.5px;color:var(--text);line-height:1.5;font-weight:600}
.revq .mark{flex:0 0 auto;font-weight:800}
.rev.ok .mark{color:var(--ok)}
.rev.bad .mark{color:var(--bad)}
.reva{font-size:12.5px;color:var(--muted);margin:8px 0 0 24px;line-height:1.6}
.reva b{color:var(--text2)}
.revy{font-size:12.5px;color:var(--text2);margin:7px 0 0 24px;line-height:1.6}
.lnk{display:inline-block;margin:8px 0 0 24px;font-size:12px;color:var(--accent);font-weight:600}

.tl{position:relative;margin-top:10px;padding-left:4px}
.tl:before{content:"";position:absolute;left:74px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,transparent,var(--line2) 6%,var(--line2) 94%,transparent)}
.tli{display:grid;grid-template-columns:60px 18px minmax(0,1fr);gap:0 14px;padding:12px 0;position:relative}
.tly{font-size:12px;color:var(--dim);text-align:right;padding-top:2px;font-family:var(--mono);font-weight:600}
.tldot{position:relative;display:flex;justify-content:center;padding-top:5px}
.tldot:before{content:"";width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);z-index:1}
.tlb{padding-bottom:2px}
.tlt{font-size:15px;font-weight:650;letter-spacing:-.01em}
.tlx{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.55;max-width:74ch}
.tlb .chip{margin-top:9px}

.palette{position:fixed;inset:0;z-index:200;background:rgba(15,23,41,.42);backdrop-filter:blur(3px);display:none;padding-top:12vh;justify-content:center;align-items:flex-start}
.palette.on{display:flex}
.palbox{width:min(680px,92vw);border:1px solid var(--line2);border-radius:16px;background:#fff;box-shadow:0 40px 100px -30px rgba(15,23,41,.55);overflow:hidden}
.palinput{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.palinput svg{color:var(--dim);width:17px;height:17px}
.palinput input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;font-family:inherit}
.palres{max-height:52vh;overflow:auto;padding:7px}
.palitem{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 12px;width:100%;text-align:left;padding:9px 11px;border-radius:10px;color:var(--text2)}
.palitem.on{background:var(--accent-soft);color:var(--accent)}
.palk{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:3px;font-weight:700}
.pall{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pals{grid-column:2;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palempty{padding:24px 18px;font-size:13px;color:var(--dim)}
.palfoot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);background:var(--panel2)}
.palfoot span{display:flex;align-items:center;gap:5px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:150;
  background:#152037;border:1px solid #24324c;color:#eef2f9;padding:11px 17px;border-radius:12px;
  font-size:13px;box-shadow:0 20px 50px -20px rgba(15,23,41,.7);transition:.22s;pointer-events:none
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.hide-sm{display:inline}

/* ============================================================
   responsive
   ============================================================ */
@media (max-width:1240px){
  .lesson-grid{grid-template-columns:minmax(0,1fr)}
  .insp{grid-template-columns:minmax(0,1fr)}
  .insp .col + .col{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:1020px){
  :root{--sbw:0px}
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:288px;z-index:60;transform:translateX(-102%);
    transition:transform .22s ease;box-shadow:var(--shadow-lg)
  }
  .sidebar.open{transform:none}
  .menubtn{display:grid}
  .labgrid{grid-template-columns:minmax(0,1fr)}
  .view{padding:18px 16px 90px}
  .topbar{padding:10px 16px}
  .lessonnav{margin:16px -16px -90px;padding:10px 16px}
}
@media (max-width:760px){
  h1{font-size:26px}
  .crumbs > span:first-child{display:none}
  .crumbs{gap:0}
  .goals{display:none}
  .lesson-head{margin-bottom:10px}
  .pips .pip span{max-width:120px}
  .lesson-head .t1{font-size:23px}
  .explain{padding:17px 16px}
  .explain h3{font-size:20px}
  .canvas{height:330px}
  .node{min-width:52px;padding:5px 7px}
  .node .nm{font-size:10px;max-width:80px}
  .node .bx{width:28px;height:28px}
  .node .ip{display:none}
  .canvas .hint{display:none}
  .hide-sm{display:none}
  .c-s,.c-d{width:90px}
  table.pcap .info{max-width:200px}
  .qstem{font-size:19px}
  .lessonnav .lbl{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div id="view" class="view scroll"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="src/lessons-advanced.js"></script>
<script src="src/lessons-deep.js"></script>
<script src="src/lessons-ops.js"></script>
<script src="src/engine.js"></script>
<script src="src/ui.js"></script>
<script src="src/lesson-view.js"></script>
<script src="src/lab-view.js"></script>
<script src="src/ref-view.js"></script>
<script src="src/tour-view.js"></script>
<script src="src/sources-view.js"></script>

<script src="src/app.js"></script>
</body>
</html>
